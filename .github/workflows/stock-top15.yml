name: Upgrade Stock Ranking to Top 15 Screener

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-pulse-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safely upgrade stock ranking UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('site/index.html')
          if not page_path.exists():
              raise SystemExit('필수 파일 site/index.html이 없습니다. 변경하지 않고 중단합니다.')
          original = page_path.read_text(encoding='utf-8')
          page = original

          # This change deliberately touches only the stock ranking interface.
          # All daily/hourly data, AI analysis, scorecards, and branding are preserved.
          if 'data-stock-rank="volume_leaders"' in page and 'embed-widget-screener.js' in page:
              print('이미 TOP 15 확장 스크리너가 설치되어 있습니다. 변경하지 않습니다.')
              raise SystemExit(0)


          def swap(old, new, label):
              global page
              if page.count(old) != 1:
                  raise SystemExit(f'{label}: 원본 HTML 위치가 예상과 다릅니다 ({page.count(old)}개). 안전을 위해 변경하지 않습니다.')
              page=page.replace(old,new,1)

          swap(
              '<h2 class="section-title">오늘의 주목 종목 TOP 5</h2><div class="section-sub">거래 활발 · 상승률 상위 · 하락률 상위 종목을 각각 5개씩 자동 표시합니다.</div>',
              '<h2 class="section-title">오늘의 주목 종목 TOP 15 탐색</h2><div class="section-sub">거래 활발 · 상승률 상위 · 하락률 상위 종목을 TradingView 확장 스크리너에서 확인하세요.</div>',
              '주목 종목 제목'
          )

          rank_tabs = """        <div class="stock-rank-toolbar">
                    <div class="stock-rank-tabs" role="group" aria-label="종목 순위 분류">
                      <button type="button" class="stock-rank-btn active" data-stock-rank="volume_leaders" aria-pressed="true">거래 활발</button>
                      <button type="button" class="stock-rank-btn" data-stock-rank="top_gainers" aria-pressed="false">상승률 상위</button>
                      <button type="button" class="stock-rank-btn" data-stock-rank="top_losers" aria-pressed="false">하락률 상위</button>
                    </div>
                    <a class="stock-rank-more" id="stock-rank-full" href="https://www.tradingview.com/markets/stocks-korea/market-movers-active/" target="_blank" rel="noopener noreferrer">TradingView 전체 순위 보기 ↗</a>
                  </div>
                  <div class="stock-rank-tip">주식 스크리너에서 상위 15위권까지 탐색할 수 있습니다. 화면에 보이는 행 수·페이지는 TradingView 위젯에서 관리합니다.</div>
          """
          swap('        <div class="tv-widget-holder" id="tv-widget-kr"',rank_tabs+'        <div class="tv-widget-holder" id="tv-widget-kr"','랭킹 탭')
          swap(
              '출처: TradingView · 각 목록은 개별 순위이며 투자 추천이 아닙니다. 데이터 지연 여부는 제공처 기준입니다.',
              '출처: TradingView 주식 스크리너 · 순위/정렬 및 표시 행 수는 제공처 관리 · 투자 추천이 아닙니다. 시세는 지연될 수 있습니다.',
              '순위 출처 표기'
          )

          # Add scoped styling without touching the existing sidebar, cards or AI panels.
          css="""    /* 15-rank TradingView screener controls; scoped to stock spotlight. */
              .stock-rank-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:0 0 10px}
              .stock-rank-tabs{display:flex;gap:7px;flex-wrap:wrap}
              .stock-rank-btn{border:1px solid #dfe5f0;background:#f5f7fc;color:#52637c;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:750}
              .stock-rank-btn:hover{background:#ebeff9}
              .stock-rank-btn.active{background:#455cca;color:white;border-color:#455cca;box-shadow:0 5px 12px #5263bd20}
              .stock-rank-more{font-size:12px;color:#4a61c6;font-weight:750;white-space:nowrap}
              .stock-rank-tip{font-size:11px;color:#7a899e;line-height:1.55;margin-bottom:13px}
              .stock-ranking-embed{width:100%;height:900px;min-height:900px}
              .stock-ranking-embed .tradingview-widget-container__widget{height:865px}
              @media(max-width:690px){.stock-rank-btn{padding:9px 10px;font-size:11px}.stock-rank-more{white-space:normal}.stock-ranking-embed{height:790px;min-height:790px}.stock-ranking-embed .tradingview-widget-container__widget{height:755px}}
          """
          swap('  </style>',css+'  </style>','CSS 영역')

          old_beg=page.index('function mountTradingView(market){') if 'function mountTradingView(market){' in page else -1
          old_end=page.find('\nfunction renderStockSpotlight(){',old_beg)
          if old_beg<0 or old_end<0 or page.count('function mountTradingView(market){')!=1:
              raise SystemExit('기존 TradingView 함수를 찾을 수 없어 변경하지 않습니다.')

          new_widget="""function stockRankUrl(market,rank){
            const area=market==='KR'?'stocks-korea':'stocks-usa';
            const suffix=rank==='top_gainers'?'market-movers-gainers/':rank==='top_losers'?'market-movers-losers/':'market-movers-active/';
            return 'https://www.tradingview.com/markets/'+area+'/'+suffix;
          }
          function mountTradingView(market){
            const host=$('tv-widget-'+market.toLowerCase());
            if(!host)return;
            const screen=state.stockRank||'volume_leaders';
            const mountKey=market+':'+screen;
            if(host.dataset.mounted===mountKey)return;
            host.replaceChildren();
            host.dataset.mounted=mountKey;
            const outer=create('div','tradingview-widget-container stock-ranking-embed');
            const inner=create('div','tradingview-widget-container__widget');
            const source=create('div','tradingview-widget-copyright');
            const link=create('a','',market==='KR'?'한국 주식 확장 순위':'미국 주식 확장 순위');
            link.href=stockRankUrl(market,screen);
            link.target='_blank';link.rel='noopener noreferrer nofollow';
            source.append(link,document.createTextNode(' by TradingView'));
            outer.append(inner,source);
            const script=document.createElement('script');
            script.type='text/javascript';
            script.async=true;
            script.src='https://s3.tradingview.com/external-embedding/embed-widget-screener.js';
            script.textContent=JSON.stringify({
              width:'100%',height:865,
              defaultColumn:'overview',defaultScreen:screen,
              showToolbar:true,locale:'kr',
              market:market==='KR'?'korea':'us',
              colorTheme:'light',isTransparent:true
            });
            script.onerror=()=>{
              inner.replaceChildren(create('div','stock-empty','스크리너를 표시하지 못했습니다. 아래 TradingView 출처 링크에서 전체 순위를 확인하세요.'));
            };
            outer.append(script);
            host.append(outer);
          }
          """
          page=page[:old_beg]+new_widget+page[old_end:]

          swap(
              "  const kr=state.stockMarket==='KR';\n  $('tv-widget-kr').hidden=!kr;",
              "  const kr=state.stockMarket==='KR';\n  const rank=state.stockRank||'volume_leaders';\n  document.querySelectorAll('[data-stock-rank]').forEach(b=>{const active=b.dataset.stockRank===rank;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});\n  const rankLink=$('stock-rank-full');if(rankLink)rankLink.href=stockRankUrl(state.stockMarket,rank);\n  $('tv-widget-kr').hidden=!kr;",
              '주목 종목 현재 탭 표시'
          )
          swap(
              "document.querySelectorAll('[data-stock-market]').forEach(b=>b.addEventListener('click',()=>{state.stockMarket=b.dataset.stockMarket;renderStockSpotlight();renderOutlooks();renderForecastAccuracy();renderNews()}));",
              "document.querySelectorAll('[data-stock-market]').forEach(b=>b.addEventListener('click',()=>{state.stockMarket=b.dataset.stockMarket;renderStockSpotlight();renderOutlooks();renderForecastAccuracy();renderNews()}));\ndocument.querySelectorAll('[data-stock-rank]').forEach(b=>b.addEventListener('click',()=>{state.stockRank=b.dataset.stockRank;renderStockSpotlight()}));",
              '순위 버튼 클릭 연결'
          )

          # Safety assertions preserve all adjacent product areas and AI reporting functions.
          for content in ('AI 종목 이슈 TOP 5','function renderStockAIInsights(){','function renderForecastAccuracy(){','hourly.json','latest.json'):
              if content in original and content not in page:
                  raise SystemExit('보호된 기능이 누락되었습니다: '+content)
          assert page.count('embed-widget-screener.js')==1
          assert page.count('data-stock-rank="top_gainers"')==1
          assert page.count('data-stock-rank="top_losers"')==1
          assert page.count('AI 종목 이슈 TOP 5')==original.count('AI 종목 이슈 TOP 5')
          assert original.count('function renderStockAIInsights(){')==page.count('function renderStockAIInsights(){')==1

          # Changes are committed atomically only after all validation passes.
          page_path.write_text(page,encoding='utf-8')
          print('완료: TradingView 주식 스크리너로 확장, 거래활발/상승률/하락률 탭 추가, 국장·미장 및 AI TOP 5 유지.')
          print('주의: 위젯 행 수·페이지·정확한 15개 제한은 TradingView 제공 방식에 따릅니다.')
          PY
      - name: Commit only stock ranking UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: expand stock movers to screener rank view"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated ranking UI
        id: deployment
        uses: actions/deploy-pages@v4
