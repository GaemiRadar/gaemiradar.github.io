name: Gaemi Radar Public Site Monitor

on:
  schedule:
    # Every two hours at minute 57 UTC; after the hourly data job at minute 17.
    # Scheduled GitHub Actions may run late or be skipped.
    - cron: '57 */2 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Generate one test GitHub Issue alert; run again unchecked to close it.'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: gaemi-radar-public-site-monitor
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    name: Verify live homepage and published JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current site records
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Probe public Pages and manage one GitHub Issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          
          NOW = dt.datetime.now(dt.timezone.utc)
          SITE = "https://marketpulse100.github.io"
          TITLE = "[개미레이더] 공개 홈페이지·배포 상태 경고"
          MARKER = "<!-- GAEMI_RADAR_PUBLIC_SITE_MONITOR_V1 -->"
          REPO = os.environ.get("REPO", "MarketPulse100/marketpulse100.github.io")
          TOKEN = os.environ.get("GH_TOKEN", "")
          TEST_ALERT = os.environ.get("TEST_ALERT", "").strip().lower() == "true"
          LOCAL_TEST = os.environ.get("SITE_MONITOR_LOCAL_TEST") == "1"
          problems = []
          details = []
          
          
          def fetch_public(path):
              url = SITE + path + "?check=" + str(int(NOW.timestamp()))
              errors = []
              for attempt in (1, 2):
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "GaemiRadarSiteMonitor/1.0 (+https://github.com/MarketPulse100/marketpulse100.github.io)",
                      "Cache-Control": "no-cache",
                      "Accept": "text/html,application/json;q=0.9,*/*;q=0.1",
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          if response.status != 200:
                              raise ValueError("HTTP " + str(response.status))
                          raw = response.read(5 * 1024 * 1024 + 1)
                          if len(raw) > 5 * 1024 * 1024:
                              raise ValueError("size exceeds 5 MiB")
                          return raw.decode("utf-8-sig")
                  except (urllib.error.URLError, ValueError, UnicodeError, TimeoutError, OSError) as exc:
                      errors.append(type(exc).__name__ + ": " + str(exc)[:160])
                      if attempt < 2:
                          time.sleep(2)
              problems.append(path + ": 공개 URL 접속 실패 (" + " / ".join(errors) + ")")
              return None
          
          
          def parse_timestamp(value):
              if not isinstance(value, str):
                  return None
              try:
                  stamp = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if stamp.tzinfo is None:
                      return None
                  return stamp.astimezone(dt.timezone.utc)
              except (TypeError, ValueError, OverflowError):
                  return None
          
          
          def load_local(kind):
              path = Path("site/data/") / kind
              try:
                  raw = json.loads(path.read_text(encoding="utf-8"))
                  return raw if isinstance(raw, dict) else None
              except (OSError, ValueError):
                  return None
          
          
          def check_json_file(filename, mode, field, hours):
              path = "/data/" + filename
              content = fetch_public(path)
              if content is None:
                  return
              try:
                  obj = json.loads(content)
                  if not isinstance(obj, dict):
                      raise ValueError("root is not an object")
              except ValueError:
                  problems.append(path + ": 배포된 JSON 파싱 실패")
                  return
              if obj.get("mode") != mode:
                  problems.append(path + ": 배포된 데이터 모드 불일치")
              timestamp = parse_timestamp(obj.get(field))
              if timestamp is None:
                  problems.append(path + ": 갱신 시각이 없거나 형식 오류")
                  return
              age = NOW - timestamp
              details.append("%s: %s (%.1f시간 경과)" % (path, obj.get(field), age.total_seconds()/3600))
              if age < -dt.timedelta(minutes=15):
                  problems.append(path + ": 갱신 시각이 15분 넘게 미래로 표시")
              elif age > dt.timedelta(hours=hours):
                  problems.append(path + ": %d시간 이상 갱신 지연" % hours)
              local = load_local(filename)
              if local:
                  local_timestamp = parse_timestamp(local.get(field))
                  # The published site should follow repository main within 30 minutes.
                  if local_timestamp and local_timestamp - timestamp > dt.timedelta(minutes=30):
                      details.append(path + ": GitHub main보다 배포 데이터가 뒤처짐")
                      problems.append(path + ": 저장소에 새 데이터가 있으나 공개 사이트 배포가 30분 이상 지연")
              if filename == "latest.json":
                  if not isinstance(obj.get("market"), list) or not isinstance(obj.get("news"), dict):
                      problems.append(path + ": 주요 일간 데이터 구조 누락")
                  if (obj.get("ai") or {}).get("status") != "ok":
                      problems.append(path + ": 배포된 AI 분석 상태가 ok가 아님")
              else:
                  news = obj.get("news")
                  if not isinstance(news, dict) or not any(isinstance(news.get(k), list) and len(news[k]) > 0 for k in ("stocks_kr", "stocks_us", "bonds")):
                      problems.append(path + ": 시간별 뉴스가 비어 있거나 데이터 구조 누락")
          
          
          html = fetch_public("/")
          if html is not None:
              required = ("개미레이더", 'id="stock-spotlight"', 'id="freshness-panel"', "</html>")
              missing = [key for key in required if key not in html]
              if missing:
                  problems.append("/: 홈페이지 기본 구조 누락 (" + ", ".join(missing) + ")")
              else:
                  details.append("/: 개미레이더 홈페이지 HTML 정상 응답")
          check_json_file("hourly.json", "hourly_public_data", "data_updated_at", 3)
          check_json_file("latest.json", "live", "generated_at", 36)
          if TEST_ALERT:
              problems.append("사용자가 선택한 시험 경고 (실제 사이트 장애가 아님)")
          
          print("검사 시각 UTC:", NOW.isoformat())
          for detail in details:
              print("OK/DETAIL:", detail)
          for problem in problems:
              print("WARNING:", problem)
          
          if LOCAL_TEST:
              print("LOCAL_TEST: issues API skipped; problems=%d" % len(problems))
              sys.exit(2 if problems else 0)
          
          if not TOKEN or "/" not in REPO:
              raise SystemExit("GITHUB_TOKEN 또는 저장소 경로 누락")
          API_ROOT = "https://api.github.com/repos/" + REPO
          HEADERS = {
              "Authorization": "Bearer " + TOKEN,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "gaemi-radar-public-site-monitor",
          }
          
          
          def api(method, route, payload=None):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(API_ROOT + route, data=data, headers=HEADERS, method=method)
              if data is not None:
                  req.add_header("Content-Type", "application/json; charset=utf-8")
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      raw = resp.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raise RuntimeError("GitHub Issues API HTTP %d: %s" % (exc.code, exc.read(400).decode("utf-8", "replace"))) from exc
          
          
          issue = None
          for page in range(1, 6):
              batch = api("GET", "/issues?state=open&per_page=100&page=%d" % page)
              for row in batch:
                  if "pull_request" not in row and row.get("title") == TITLE and MARKER in (row.get("body") or ""):
                      issue = row
                      break
              if issue or len(batch) < 100:
                  break
          
          if problems:
              if issue:
                  print("문제가 지속되고 있습니다. 기존 경고 이슈 유지:", issue.get("html_url"))
                  print("반복 알림 방지를 위해 새 이슈를 생성하지 않습니다.")
                  sys.exit(0)
              body = (MARKER + "\n## 개미레이더 공개 사이트 상태 경고\n\n"
                  + "공개 홈페이지에서 점검된 문제입니다. GitHub 저장소에 정상 파일이 있더라도 배포가 실패했을 수 있습니다.\n\n"
                  + "\n".join("- " + p for p in problems)
                  + "\n\n**확인 시각(UTC):** " + NOW.isoformat()
                  + "\n\n**점검 상세**\n" + "\n".join("- " + d for d in details)
                  + "\n\n**확인 링크**\n"
                  + "- [개미레이더 홈페이지](https://marketpulse100.github.io/)\n"
                  + "- [GitHub Actions](https://github.com/" + REPO + "/actions)\n"
                  + "- [GitHub Pages 설정](https://github.com/" + REPO + "/settings/pages)\n"
                  + "\n정상으로 돌아오면 다음 점검 실행 시 자동으로 이슈가 종료됩니다."
                  + " 시험 경고였다면 test_alert를 끄고 다시 실행하세요.\n")
              result = api("POST", "/issues", {"title": TITLE, "body": body, "assignees": [REPO.split("/")[0]]})
              print("SITE ALERT ISSUE CREATED:", result.get("html_url"))
              sys.exit(1)
          
          if issue:
              issue_number = issue["number"]
              api("POST", "/issues/%d/comments" % issue_number, {
                  "body": "✅ 홈페이지 및 배포 데이터가 정상 범위로 복구됐습니다. 확인 시각(UTC): " + NOW.isoformat()
              })
              api("PATCH", "/issues/%d" % issue_number, {"state": "closed", "state_reason": "completed"})
              print("RECOVERED: closed public site alert issue #", issue_number)
          else:
              print("HEALTHY: public site and deployed data verified; no open alert issue.")
          PY
