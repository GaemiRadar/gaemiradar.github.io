name: Install US Top 10 Market Movers

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-pulse-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch only US stock ranking
        shell: bash
        run: |
          cat > /tmp/patch_us_movers.py <<'PY'
          """Safely upgrade the US hotlist to Quotelinks 10-row market movers.

          Run from repository root. Only site/index.html is written.
          """
          from pathlib import Path

          PAGE = Path('site/index.html')
          MARKER = 'gaemi-quotelinks-10'


          def main():
              if not PAGE.exists():
                  raise SystemExit('site/index.html을 찾을 수 없어 중단합니다.')
              src = PAGE.read_text(encoding='utf-8')
              if MARKER in src:
                  print('이미 미국주식 TOP 10 위젯이 적용되어 있습니다. 변경하지 않습니다.')
                  return
              if 'embed-widget-screener.js' in src or '오늘의 주목 종목 TOP 15 탐색' in src:
                  raise SystemExit('제한된 TOP 15 스크리너 버전입니다. 기존 TOP 5로 복구한 뒤 적용하세요.')
              if 'embed-widget-hotlists.js' not in src or '오늘의 주목 종목 TOP 5' not in src:
                  raise SystemExit('기존 TOP 5 핫리스트를 찾지 못해 안전을 위해 중단합니다.')

              before = src

              def replace_once(old, new, label):
                  nonlocal src
                  n = src.count(old)
                  if n != 1:
                      raise SystemExit(f'{label}: 예상한 텍스트가 1곳이 아닌 {n}곳입니다. 적용 중단')
                  src = src.replace(old, new, 1)

              replace_once(
                  '<h2 class="section-title">오늘의 주목 종목 TOP 5</h2>',
                  '<h2 class="section-title" id="stock-main-title">오늘의 주목 종목 TOP 5</h2>',
                  '시장별 제목',
              )
              replace_once(
                  '국내·미국 시장의 거래 활발 · 상승률 상위 · 하락률 상위 종목을 각각 5개씩 홈페이지에서 확인할 수 있습니다.',
                  '<span id="stock-main-summary">국내주식의 거래 활발 · 상승률 상위 · 하락률 상위 종목 각 5개를 표시합니다.</span>',
                  '시장별 설명',
              )
              replace_once(
                  '<div class="tv-widget-holder" id="tv-widget-us" aria-label="미국주식 거래 활발, 상승률, 하락률 종목" hidden></div>',
                  '<div class="tv-widget-holder" id="tv-widget-us" aria-label="미국주식 거래 활발, 상승률, 하락률 종목 (각 10개, 전일 종가 기준)" hidden></div>',
                  '미국주식 위젯 설명',
              )
              replace_once(
                  '최근 72시간 뉴스 언급량 상위 · 지정된 주요 기업 후보 중 선정 · 위 TradingView 거래 순위와 별개',
                  '최근 72시간 뉴스 언급량 상위 · 지정된 주요 기업 후보 중 선정 · 위 시세 순위와 별개',
                  'AI 섹션 설명',
              )
              replace_once(
                  '종목 가격·거래량 순위는 위 TradingView에서 확인하세요.',
                  '종목 가격·거래량 순위는 위 시세 제공처에서 확인하세요.',
                  'AI 섹션 유의문구',
              )
              replace_once(
                  '  </style>',
                  '''    /* Quotelinks renders inside its own Shadow DOM. Do not hide provider links. */
              .ql-movers-holder{display:flex;justify-content:center;min-height:620px;padding:12px 8px}
              .ql-movers-holder .ql-movers{width:100%;max-width:480px;min-width:0}
              @media(max-width:690px){.ql-movers-holder{min-height:580px;padding:10px 0}}
            </style>''',
                  '미국 위젯 레이아웃',
              )
              replace_once(
                  '''  const host=$('tv-widget-'+market.toLowerCase());
            if(!host || host.dataset.mounted==='hotlists')return;''',
                  '''  const host=$('tv-widget-'+market.toLowerCase());
            if(!host)return;
            // gaemi-quotelinks-10: US market movers, official permitted embed, EOD only.
            if(market==='US'){
              if(host.dataset.mounted==='quotelinks10')return;
              host.replaceChildren();
              host.dataset.mounted='quotelinks10';
              const wrapper=create('div','ql-movers-holder');
              const widget=create('div','ql-movers');
              widget.setAttribute('data-market','stocks');
              widget.setAttribute('data-rows','10');
              widget.setAttribute('data-tab','active');
              widget.setAttribute('data-theme','light');
              const firstLink=create('a','','US stock movers');
              firstLink.href='https://www.quotelinks.com/stocks.html';
              const secondLink=create('a','','Quotelinks');
              secondLink.href='https://www.quotelinks.com/';
              widget.append(firstLink,document.createTextNode(' by '),secondLink);
              wrapper.append(widget);
              host.append(wrapper);
              const script=document.createElement('script');
              script.type='text/javascript';
              script.src='https://www.quotelinks.com/widgets/movers.js';
              script.async=true;
              script.onerror=()=>{
                const error=create('div','stock-empty','미국주식 TOP 10 위젯을 불러오지 못했습니다. 아래 Quotelinks 링크로 확인하세요.');
                wrapper.prepend(error);
              };
              host.append(script);
              return;
            }
            if(host.dataset.mounted==='hotlists')return;''',
                  '미국주식 위젯 삽입',
              )
              replace_once(
                  '''  $('stock-asof').textContent=kr?'국내 주식 · TradingView 제공':'미국 주식 · TradingView 제공';''',
                  '''  $('stock-asof').textContent=kr?'국내 주식 · TradingView 제공':'미국 주식 · Quotelinks 제공 · 장 마감 기준';
            $('stock-main-title').textContent=kr?'오늘의 주목 종목 TOP 5':'오늘의 주목 종목 TOP 10';
            $('stock-main-summary').textContent=kr?'국내주식의 거래 활발 · 상승률 상위 · 하락률 상위 종목 각 5개를 표시합니다.':'미국주식 거래 활발 · 상승률 상위 · 하락률 상위 종목 각 10개 · 미국장 마감 후 갱신';
            $('stock-source').textContent=kr?'출처: TradingView 핫리스트 · 각 TOP 5 · 시세 지연 가능 · 투자 추천 아님':'출처: Quotelinks 공식 무료 임베드 · 종목별 각 TOP 10 · 미국장 종가 기준 · 투자 추천 아님';''',
                  '시장별 표시 전환',
              )

              protected = (
                  '<div class="brand-name">개미레이더</div>',
                  'AI 종목 이슈 TOP 5',
                  'function renderStockAIInsights(){',
                  'function renderForecastAccuracy(){',
                  'hourly.json',
                  'latest.json',
              )
              for token in protected:
                  if token in before and token not in src:
                      raise SystemExit(f'보호 기능이 누락되었습니다: {token}')
              for token in (MARKER, "data-rows','10'", 'widgets/movers.js'):
                  if src.count(token) != 1:
                      raise SystemExit(f'위젯 무결성 검사 실패: {token}')
              if src.count('embed-widget-hotlists.js') != before.count('embed-widget-hotlists.js'):
                  raise SystemExit('국내 TradingView 핫리스트가 달라졌습니다. 중단합니다.')
              PAGE.write_text(src, encoding='utf-8')
              print('미국 TOP10 Quotelinks 위젯 설치 완료. 국내 TOP5·AI TOP5 및 예측 기록 유지.')


          if __name__ == '__main__':
              main()
          PY
          python /tmp/patch_us_movers.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('site/index.html').read_text(encoding='utf-8')
          parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          if not parts: raise SystemExit('inline JavaScript missing')
          Path('/tmp/gaemi-market-main.js').write_text(parts[-1],encoding='utf-8')
          PY
          node --check /tmp/gaemi-market-main.js
      - name: Commit HTML change (avoid duplicate daily Gemini run)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: show US top 10 movers on Gaemi Radar [skip ci]'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
