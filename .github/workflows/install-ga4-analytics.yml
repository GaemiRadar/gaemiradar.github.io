name: Install GA4 Visitor Analytics (Consent First)

on:
  workflow_dispatch:
    inputs:
      measurement_id:
        description: "GA4 Measurement ID (example G-ABC123DE45)"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-pulse-pages
  cancel-in-progress: false
  queue: max

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Install GA4 only in site files
        env:
          GA4_MEASUREMENT_ID: ${{ inputs.measurement_id }}
        shell: bash
        run: |
          python3 - <<'PYINSTALL'
          from pathlib import Path
          import os, re, json, base64

          measurement_id = (os.environ.get('GA4_MEASUREMENT_ID') or '').strip().upper()
          if not re.fullmatch(r'G-[A-Z0-9]{6,20}', measurement_id):
              raise SystemExit('Invalid GA4 measurement ID. Enter a value like G-ABC123DE45.')
          site = Path('site')
          index_path = site / 'index.html'
          if not index_path.is_file():
              raise SystemExit('Missing site/index.html. This installer is specific to GAEMI RADAR.')
          html = index_path.read_text(encoding='utf-8')
          for marker in ('<head>', '</head>', '<footer class="footer">', 'data-tab="stocks"', 'data-stock-market="KR"', 'id="freshness-panel"'):
              if marker not in html:
                  raise SystemExit('Dashboard structure differs, refusing to overwrite: ' + marker)
          if 'googletagmanager.com/gtag/js' in html or 'GAEMI_GA4_MEASUREMENT_ID' in html:
              raise SystemExit('Another GA4 integration found in the homepage. Check it before installing twice.')

          scripts = '  <script src="./ga4-config.js" defer></script>\n  <script src="./ga4-analytics.js" defer></script>\n'
          if 'src="./ga4-analytics.js"' not in html:
              html = html.replace('</head>', scripts + '</head>', 1)
          footer_button = '<span><a class="ga4-footer-link" href="./privacy.html">방문 통계 안내</a> · <button class="ga4-footer-button" type="button" id="ga4-manage-consent">통계 수집 설정</button></span>'
          if 'id="ga4-manage-consent"' not in html:
              html = html.replace('<footer class="footer">', '<footer class="footer">' + footer_button, 1)
          if html.count('src="./ga4-analytics.js"') != 1 or html.count('id="ga4-manage-consent"') != 1:
              raise SystemExit('Duplicate or missing GA4 integration marker in homepage.')

          config = '// GA4 Measurement ID (public site identifier, not a secret)\nwindow.GAEMI_GA4_MEASUREMENT_ID = ' + json.dumps(measurement_id) + ';\n'
          # The asset text is bundled in the installer so only one YAML needs uploading.
          analytics_js = base64.b64decode('').decode('utf-8')
          privacy_html = base64.b64decode('').decode('utf-8')
          if 'privacy.html' not in html or 'menu_select' not in analytics_js:
              raise SystemExit('Installer integrity check failed.')

          for dest, content in ((index_path, html), (site / 'ga4-config.js', config),
                                (site / 'ga4-analytics.js', analytics_js), (site / 'privacy.html', privacy_html)):
              if dest.exists() and dest.name == 'privacy.html' and '방문 통계 및 개인정보 안내' not in dest.read_text(encoding='utf-8'):
                  raise SystemExit('Existing unrelated privacy.html detected. Stopping without overwrite.')
              dest.write_text(content, encoding='utf-8')
              print('Updated:', dest)
          print('GA4 installed into the site directory. Google tag is blocked until consent.')
          PYINSTALL

      - name: Validate installed JavaScript and site files
        shell: bash
        run: |
          node --check site/ga4-config.js
          node --check site/ga4-analytics.js
          python3 - <<'PYCHECK'
          from pathlib import Path
          h=Path('site/index.html').read_text(encoding='utf-8')
          js=Path('site/ga4-analytics.js').read_text(encoding='utf-8')
          assert h.count('src="./ga4-analytics.js"') == 1
          assert h.count('src="./ga4-config.js"') == 1
          assert h.count('id="ga4-manage-consent"') == 1
          assert 'https://gaemiradar.github.io/' in h
          assert all(x in js for x in ('menu_select', 'market_select', 'analytics_storage', 'ga4-consent-banner'))
          assert Path('site/privacy.html').is_file()
          print('GA4 site validation passed.')
          PYCHECK

      - name: Commit site files only (never modify workflows)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/index.html site/ga4-config.js site/ga4-analytics.js site/privacy.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: install consent-first GA4 visitor analytics [skip ci]"
            git push origin HEAD:main
          else
            echo "GA4 already installed with same measurement ID."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload full website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: install
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GA4 website
        id: deployment
        uses: actions/deploy-pages@v4
